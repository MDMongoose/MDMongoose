[project]
name = "mdm"
version = "0.1.0"
description = "Master Data Management on Databricks: one hierarchy, one Delta table"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
app = ["fastapi==0.115.12", "uvicorn[standard]==0.34.2", "databricks-sdk>=0.50.0", "openpyxl==3.1.5", "duckdb==1.4.4",
       "pyarrow==18.1.0"]
dev = ["pytest>=8", "httpx>=0.27", "openpyxl==3.1.5", "fastapi==0.115.12", "duckdb==1.4.4", "splink==4.0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]

[tool.ruff]
line-length = 120
